<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      id="viewport"
    />
    <title>Douyin</title>
    <script>
      // ✅ 优化：移除严格的 Telegram 环境检查，避免误判导致 WebView 崩溃
      // 改为仅记录警告，不阻止应用启动
      ;(function () {
        try {
          const host = window.location.hostname
          const isDev =
            host === 'localhost' ||
            host === '127.0.0.1' ||
            host.endsWith('.test') ||
            host.endsWith('.local')
          if (isDev) return

          // 延迟检查，给 Telegram SDK 更多时间加载
          setTimeout(() => {
            try {
              const url = window.location.href
              const hasTgData =
                url.includes('tgWebAppData') ||
                window.location.hash.includes('tgWebAppData') ||
                window.location.search.includes('tgWebAppData')
              const uaTelegram = /Telegram/i.test(navigator.userAgent)
              const refTelegram = /t\.me|telegram\.org|telegram\.me|web\.telegram\.org/i.test(
                document.referrer || ''
              )
              const hasTelegramObj = !!(window.Telegram && window.Telegram.WebApp)

              // ✅ 只记录警告，不阻止应用运行
              if (!hasTgData && !uaTelegram && !refTelegram && !hasTelegramObj) {
                console.warn('[Telegram Check] 未检测到 Telegram 环境，但允许应用继续运行')
              }
            } catch (e) {
              console.warn('[Telegram Check] 检查过程出错，继续运行:', e)
            }
          }, 2000) // 延迟 2 秒检查，确保 SDK 有时间加载
        } catch (e) {
          console.warn('[Telegram Check] 初始化失败，继续运行:', e)
        }
      })()
    </script>
    <script>
      // 兜底 TelegramGameProxy，避免第三方脚本提前读取时报错
      window.TelegramGameProxy = window.TelegramGameProxy || {}
      if (typeof window.TelegramGameProxy.receiveEvent !== 'function') {
        window.TelegramGameProxy.receiveEvent = function () {}
      }
    </script>
    <!-- Telegram WebApp Script -->
    <script>
      // ✅ 优化：添加错误处理和超时机制，防止脚本加载失败导致 WebView 崩溃
      ;(function () {
        const script = document.createElement('script')
        script.src = 'https://telegram.org/js/telegram-web-app.js'
        script.async = true

        // 设置超时（5秒）
        const timeout = setTimeout(() => {
          console.warn('[Telegram WebApp] 脚本加载超时，使用降级方案')
          // 创建降级对象，避免后续代码报错
          if (!window.Telegram) {
            window.Telegram = {
              WebApp: {
                ready: function () {},
                initData: '',
                initDataUnsafe: {},
                version: 'fallback',
                platform: 'unknown'
              }
            }
          }
        }, 5000)

        script.onload = function () {
          clearTimeout(timeout)
          try {
            if (window.Telegram && window.Telegram.WebApp) {
              window.Telegram.WebApp.ready()
            }
          } catch (e) {
            console.error('[Telegram WebApp] 初始化失败:', e)
          }
        }

        script.onerror = function () {
          clearTimeout(timeout)
          console.warn('[Telegram WebApp] 脚本加载失败，使用降级方案')
          // ✅ 优化：立即创建降级对象，确保应用可以正常启动
          try {
            if (!window.Telegram) {
              window.Telegram = {
                WebApp: {
                  ready: function () {},
                  initData: '',
                  initDataUnsafe: {},
                  version: 'fallback',
                  platform: 'unknown'
                }
              }
            }
          } catch (e) {
            console.error('[Telegram WebApp] 创建降级对象失败:', e)
          }
        }

        document.head.appendChild(script)
      })()
    </script>
    <style>
      ::-webkit-scrollbar {
        display: none; /* Chrome Safari */
      }

      .fade-in {
        animation: fade-in 0.3s;
      }

      .fade-out {
        animation: fade-out 0.4s;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes fade-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
