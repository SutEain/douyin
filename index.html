    <script>
      // ✅ 彻底禁用所有控制台输出（仅非本地环境生效，除非 URL 包含 debug=1 或 console=1）
      // 🎯 生产环境启用 console 的方法：
      // 1. URL 添加 ?debug=1 或 ?console=1
      // 2. 在浏览器控制台执行：window.__enableConsole__()
      ;(function () {
        try {
          const host = window.location.hostname
          const isDev =
            host === 'localhost' ||
            host === '127.0.0.1' ||
            host.endsWith('.test') ||
            host.endsWith('.local')
          const isDebug =
            window.location.search.includes('debug=1') ||
            window.location.search.includes('console=1')

          if (!isDev && !isDebug) {
            const noop = function () {}
            const methods = [
              'log',
              'info',
              'debug',
              'warn',
              'error',
              'trace',
              'table',
              'group',
              'groupCollapsed',
              'groupEnd',
              'time',
              'timeEnd',
              'count',
              'assert'
            ]
            // 🎯 安全保存原始 console
            try {
              window.__rawConsole__ = {
                log: window.console.log,
                info: window.console.info,
                warn: window.console.warn,
                error: window.console.error,
                debug: window.console.debug,
                trace: window.console.trace,
                table: window.console.table,
                group: window.console.group,
                groupCollapsed: window.console.groupCollapsed,
                groupEnd: window.console.groupEnd,
                time: window.console.time,
                timeEnd: window.console.timeEnd,
                count: window.console.count,
                assert: window.console.assert
              }
            } catch (e) {}

            // 🎯 仅覆盖已知方法，不使用 for...in 遍历原生对象
            methods.forEach(function (m) {
              try {
                if (typeof window.console[m] === 'function') {
                  window.console[m] = noop
                }
              } catch (e) {}
            })

            // 🎯 提供恢复 console 的方法（方便调试）
            window.__enableConsole__ = function () {
              if (window.__rawConsole__) {
                Object.keys(window.__rawConsole__).forEach(function (m) {
                  try {
                    if (typeof window.__rawConsole__[m] === 'function') {
                      window.console[m] = window.__rawConsole__[m]
                    }
                  } catch (e) {}
                })
                console.log('[Console] ✅ Console 已启用！')
              }
            }
          } else {
            // 开发环境或已启用调试，提供空函数避免报错
            window.__enableConsole__ = function () {
              console.log('[Console] Console 已经是启用状态')
            }
          }
        } catch (e) {
          // ignore
        }
      })()
    </script>

      // ✅ 优化：快速检测环境，不阻塞渲染
      ;(function () {

    <!-- Telegram WebApp Script -->
    <script>
      // 🚀 优化：快速加载 Telegram SDK，浏览器环境直接跳过
      ;(function () {
        // 🎯 快速检测是否在 Telegram 环境
        const url = window.location.href
        const hasTgData =
          url.includes('tgWebAppData') ||
          window.location.hash.includes('tgWebAppData') ||
          window.location.search.includes('tgWebAppData')
        const uaTelegram = /Telegram/i.test(navigator.userAgent)
        const isTelegramEnv = hasTgData || uaTelegram

        // 🚀 如果不是 Telegram 环境，立即创建降级对象，不加载脚本（节省时间）
        if (!isTelegramEnv) {
          console.log('[Init] 🌐 浏览器环境，创建 Telegram 降级对象')
          console.log('[Init] 环境检测结果:', {
            hasTgData,
            uaTelegram,
            userAgent: navigator.userAgent,
            url: window.location.href
          })

          window.Telegram = {
            WebApp: {
              ready: function () {
                console.log('[Init] 降级对象 ready() 被调用')
              },
              initData: '',
              initDataUnsafe: {},
              version: 'fallback',
              platform: 'unknown',
              // 🎯 添加更多兼容属性，避免某些代码报错
              isVersionAtLeast: function () {
                return false
              },
              sendData: function () {
                console.warn('[Init] 降级对象 sendData() 被调用')
              },
              close: function () {
                console.warn('[Init] 降级对象 close() 被调用')
              },
              expand: function () {
                console.warn('[Init] 降级对象 expand() 被调用')
              }
            }
          }

          console.log('[Init] ✅ Telegram 降级对象已创建:', window.Telegram)
          return
        }

        // 🎯 Telegram 环境：加载真实 SDK
        console.log('[Init] Telegram 环境，加载 SDK')
        const script = document.createElement('script')
        script.src = 'https://telegram.org/js/telegram-web-app.js'
        script.async = true

        // 缩短超时时间到 3 秒（Telegram 环境下 SDK 加载很快）
        const timeout = setTimeout(() => {
          console.warn('[Telegram WebApp] SDK 加载超时（3秒），使用降级方案')
          if (!window.Telegram) {
            window.Telegram = {
              WebApp: {
                ready: function () {},
                initData: '',
                initDataUnsafe: {},
                version: 'fallback',
                platform: 'unknown'
              }
            }
          }
        }, 3000)

        script.onload = function () {
          clearTimeout(timeout)
          try {
            if (window.Telegram && window.Telegram.WebApp) {
              window.Telegram.WebApp.ready()
              console.log('[Init] Telegram SDK 加载成功')
            }
          } catch (e) {
            console.error('[Telegram WebApp] 初始化失败:', e)
          }
        }

        script.onerror = function () {
          clearTimeout(timeout)
          console.warn('[Telegram WebApp] SDK 加载失败，使用降级方案')
          if (!window.Telegram) {
            window.Telegram = {
              WebApp: {
                ready: function () {},
                initData: '',
                initDataUnsafe: {},
                version: 'fallback',
                platform: 'unknown'
              }
            }
          }
        }

        document.head.appendChild(script)
      })()
    </script>
    <script>
      // 🚀 调试工具：如果 URL 包含 console=1，加载 eruda
      ;(function () {

            eruda.init()
