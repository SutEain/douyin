<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>抖音管理后台</title>
    <script>
      // ✅ 彻底禁用所有控制台输出（仅非本地环境生效，除非 URL 包含 debug=1）
      // 🎯 生产环境启用 console 的方法：
      // 1. URL 添加 ?debug=1
      // 2. 在浏览器控制台执行：window.__enableConsole__()
      ;(function () {
        try {
          const host = window.location.hostname
          const isDev =
            host === 'localhost' ||
            host === '127.0.0.1' ||
            host.endsWith('.test') ||
            host.endsWith('.local')
          const isDebug = window.location.search.includes('debug=1')

          if (!isDev && !isDebug) {
            const noop = function () {}
            const methods = [
              'log',
              'info',
              'debug',
              'warn',
              'error',
              'trace',
              'table',
              'group',
              'groupCollapsed',
              'groupEnd',
              'time',
              'timeEnd',
              'count',
              'assert'
            ]
            // 🎯 保存原始 console 引用，备用
            window.__rawConsole__ = {}
            for (const key in window.console) {
              window.__rawConsole__[key] = window.console[key]
            }
            // 覆盖方法
            methods.forEach(function (m) {
              if (typeof window.console[m] === 'function') {
                window.console[m] = noop
              }
            })

            // 🎯 提供恢复 console 的方法（方便调试）
            window.__enableConsole__ = function () {
              if (window.__rawConsole__) {
                Object.keys(window.__rawConsole__).forEach(function (m) {
                  try {
                    if (typeof window.__rawConsole__[m] === 'function') {
                      window.console[m] = window.__rawConsole__[m]
                    }
                  } catch (e) {}
                })
                // 使用原始 console.log 输出提示
                if (window.__rawConsole__.log) {
                  window.__rawConsole__.log('[Console] ✅ Console 已启用！')
                }
              }
            }
          } else {
            // 开发环境或已启用调试，提供空函数避免报错
            window.__enableConsole__ = function () {
              console.log('[Console] Console 已经是启用状态')
            }
          }
        } catch (e) {
          // ignore
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
